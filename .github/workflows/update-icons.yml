# Checks every week for a new release of Microsoft's Fluent UI System Icons
# and, when there is one, opens a pull request that imports it.
#
# - Compares the latest @fluentui/svg-icons version on npm with
#   data/meta.json. Nothing happens when they match.
# - Imports the matching release (git tag) of microsoft/fluentui-system-icons
#   (it waits for the next run if the tag isn't published yet)
#   with scripts/import-upstream.mjs, builds the site to check it still
#   builds (and stays under Cloudflare Pages' 20,000-file limit), then pushes
#   the branch icons/<version> and opens a pull request.
# - Nothing goes live until that pull request is merged; merging deploys it
#   like any other change.
#
# A second job does the same for the Material Icons site (sites/material):
# it compares @material-symbols/svg-400 on npm with
# sites/material/data/meta.json, imports with scripts/import-material.mjs and
# opens a pull request from material-icons/<version>.
#
# Run it by hand from the Actions tab (Run workflow) to check right away.
# If GitHub Actions isn't allowed to open pull requests in this repository,
# the run still pushes the branch and links to it in the run summary.
name: Update icons from Microsoft and Google

on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-icons
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'coltongriffith/fluenticons'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Check for a new release
        id: check
        run: |
          latest=$(npm view @fluentui/svg-icons version)
          current=$(node -p "require('./data/meta.json').svgIcons")
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Up to date: @fluentui/svg-icons $current" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "icons/$latest" > /dev/null; then
            echo "Branch icons/$latest already exists; review or merge its pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif ! git ls-remote --exit-code --tags https://github.com/microsoft/fluentui-system-icons.git "refs/tags/$latest" > /dev/null; then
            # The metadata, fonts and Flutter names must come from the same release.
            echo "@fluentui/svg-icons $latest is out, but the $latest tag isn't on GitHub yet. Trying again next run." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release: $current -> $latest" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.update == 'true'
        run: yarn install --frozen-lockfile

      - name: Import the release
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$VERSION" \
            https://github.com/microsoft/fluentui-system-icons.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set --no-cone '/assets/*/metadata.json' \
            '/assets/*/SVG/*_24_filled.svg' '/assets/*/SVG/*_24_regular.svg' \
            '/fonts/*.json' '/flutter/lib/src/fluent_icons.dart'
          node scripts/import-upstream.mjs "$RUNNER_TEMP/upstream" "$VERSION" | tee "$RUNNER_TEMP/import.log"

      - name: Build the site
        if: steps.check.outputs.update == 'true'
        run: |
          yarn generate
          files=$(find dist -type f | wc -l)
          echo "Files: $files"
          test "$files" -lt 20000

      - name: Open a pull request
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="icons/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data public/icons
          if git diff --cached --quiet; then
            echo "No changes to the icon data." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Update icons to @fluentui/svg-icons $VERSION"
          git push origin "$branch"
          {
            echo "Imports Microsoft's Fluent UI System Icons **$VERSION** (\`@fluentui/svg-icons@$VERSION\`)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/import.log"
            echo '```'
            echo
            echo "The site builds with these changes. New designs appear on /new/ and in the RSS feed once this is merged; merging deploys it."
          } > "$RUNNER_TEMP/body.md"
          if gh pr create --base main --head "$branch" --title "Update icons to $VERSION" --body-file "$RUNNER_TEMP/body.md"; then
            echo "Opened a pull request for $branch." >> "$GITHUB_STEP_SUMMARY"
          else
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::Pushed $branch but couldn't open a pull request. Open it here: $url"
            echo "Pushed \`$branch\`. [Open a pull request]($url)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same for Google's Material Symbols on the Material Icons site
  # (sites/material): @material-symbols/svg-400 plus Google Fonts' metadata.
  update-material:
    if: github.repository == 'coltongriffith/fluenticons'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Check for a new release
        id: check
        run: |
          latest=$(npm view @material-symbols/svg-400 version)
          current=$(node -p "require('./sites/material/data/meta.json').version")
          # Symbols imported before Google's metadata described them.
          missing=$(node -p "require('./sites/material/data/meta.json').missingMetadata || 0")
          branch="material-icons/$latest"
          if [ "$latest" = "$current" ] && [ "$missing" != "0" ]; then
            branch="material-icons/$latest-metadata-$(date -u +%Y%m%d)"
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ] && [ "$missing" = "0" ]; then
            echo "Up to date: @material-symbols/svg-400 $current" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Branch $branch already exists; review or merge its pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif [ "$latest" = "$current" ]; then
            echo "$missing symbols in $current had no Google metadata; importing again." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "New Material Symbols release: $current -> $latest" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.update == 'true'
        run: yarn install --frozen-lockfile

      - name: Import the release
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/import-material.mjs "$VERSION" | tee "$RUNNER_TEMP/import.log"

      - name: Build the site
        if: steps.check.outputs.update == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn material:generate
          files=$(find sites/material/dist -type f | wc -l)
          echo "Files: $files"
          test "$files" -lt 20000

      - name: Open a pull request
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ steps.check.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A sites/material/data sites/material/public/icons
          if git diff --cached --quiet; then
            echo "No changes to the icon data." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Update Material Symbols to @material-symbols/svg-400 $VERSION"
          git push origin "$branch"
          {
            echo "Imports Google's Material Symbols from \`@material-symbols/svg-400@$VERSION\` and Google Fonts' icon metadata."
            echo
            echo '```'
            cat "$RUNNER_TEMP/import.log"
            echo '```'
            echo
            echo "The Material Icons site builds with these changes. Merging deploys it (deploy-material.yml)."
          } > "$RUNNER_TEMP/body.md"
          if gh pr create --base main --head "$branch" --title "Update Material Symbols to $VERSION" --body-file "$RUNNER_TEMP/body.md"; then
            echo "Opened a pull request for $branch." >> "$GITHUB_STEP_SUMMARY"
          else
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::Pushed $branch but couldn't open a pull request. Open it here: $url"
            echo "Pushed \`$branch\`. [Open a pull request]($url)" >> "$GITHUB_STEP_SUMMARY"
          fi
