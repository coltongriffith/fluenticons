# Builds the Lucide Icons site (sites/lucide) and uploads it to its own
# Cloudflare Pages project. fluenticons.co and materialicons.co are deployed
# separately (deploy.yml, deploy-material.yml) and aren't affected by this workflow.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   LUCIDE_PAGES_PROJECT  Cloudflare Pages project name (default "lucideicons").
#                         If the project doesn't exist yet, the first run
#                         creates it as a direct-upload project.
#   LUCIDE_SITE_URL       https://lucideicons.co, once the custom domain is
#                         attached to that project. Production runs then
#                         check that the site serves the new build.
#
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as
# deploy.yml.
#
# - Every push to main deploys to production when it can change the site.
# - Run it manually from the Actions tab for a preview (the default branch
#   "preview") or to redeploy production (branch "main").
name: Deploy Lucide Icons to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "data/**"
      - "public/**"
      - "content/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-material.yml"
      - ".github/workflows/update-icons.yml"
      # The Material Icons site (its data is read for "Also in" links)
      - "sites/material/app/**"
      - "sites/material/public/**"
      - "sites/material/content/**"
      - "scripts/import-material.mjs"
      # fluenticons.co's agent API, MCP server and CLI
      - "agent/**"
      - "functions/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Deployment branch. "preview" (or any other name) creates a preview URL
          only; "main" deploys to production.
        required: true
        default: preview

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-lucide-${{ github.event_name == 'push' && 'main' || inputs.branch }}
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.LUCIDE_PAGES_PROJECT || 'lucideicons' }}
  SITE_URL: ${{ vars.LUCIDE_SITE_URL }}
  BRANCH: ${{ github.event_name == 'push' && 'main' || inputs.branch }}

jobs:
  deploy:
    if: github.repository == 'coltongriffith/fluenticons'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lucide:generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check build output
        run: |
          for f in index.html icon/house/index.html guides/index.html license/index.html category/index.html browse/index.html og/house.png sitemap.xml _headers _redirects icons/house.svg; do
            test -s "sites/lucide/dist/$f" || { echo "Missing sites/lucide/dist/$f"; exit 1; }
          done
          files=$(find sites/lucide/dist -type f | wc -l)
          echo "Files: $files"
          test "$files" -lt 20000
          grep -q "<title>Lucide Icons" sites/lucide/dist/index.html
          build_id=$(grep -o 'buildId:"[^"]*"' sites/lucide/dist/index.html | head -1)
          test -n "$build_id" || { echo "No buildId in index.html"; exit 1; }
          echo "BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "Deploying $build_id to $PROJECT ($BRANCH)"

      - name: Create the Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw -- "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      # Run from sites/lucide so wrangler doesn't pick up the repo root's
      # functions/ (fluenticons.co's agent API), which this site doesn't serve.
      - name: Deploy
        working-directory: sites/lucide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name "$PROJECT"
          --branch "$BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=true

      - name: Check the site serves the new build
        if: env.BRANCH == 'main' && env.SITE_URL != ''
        run: |
          for _ in $(seq 1 18); do
            if curl -fsS "$SITE_URL/" | grep -qF "$BUILD_ID" \
              && curl -fsS -o /dev/null "$SITE_URL/icon/house/"; then
              echo "$SITE_URL is serving $BUILD_ID"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL is not serving $BUILD_ID. Check the site; roll back in Cloudflare > $PROJECT > Deployments if needed."
          exit 1
